# Construit et signe le launcher sur des machines Windows et Mac de GitHub,
# puis crée UNE release en BROUILLON dans SiclUve/bworkshop-releases (installateur Windows,
# image disque Mac, et un latest.json commun aux deux).
# Rien n'est visible des joueurs tant que le brouillon n'est pas publié à la main,
# puis annoncé avec le workflow « Annoncer la mise à jour ».
#
# Avant : changer la version dans src-tauri/tauri.conf.json, package.json, Cargo.toml
# (racine) et Cargo.lock, puis pousser.
#
# Mac : application universelle (Apple Silicon + Intel), signée « ad hoc » (sans compte
# développeur Apple). Au premier lancement : Réglages Système > Confidentialité et sécurité >
# « Ouvrir quand même » (macOS 15 n'accepte plus le clic droit > Ouvrir). Les mises à jour suivantes
# passent par le launcher lui-même (signées avec la même clé que sous Windows).
#
# Secrets du dépôt :
#  - TAURI_SIGNING_PRIVATE_KEY : contenu de la clé privée de mise à jour ;
#  - TAURI_SIGNING_PRIVATE_KEY_PASSWORD : son mot de passe ;
#  - RELEASES_TOKEN : jeton limité à SiclUve/bworkshop-releases (Contents : lecture et écriture).

name: Construire une version

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Ce qui change, en une phrase (montré aux joueurs)"
        required: true
      essai:
        description: "Essai : tout construire sans rien publier (fichiers dans l'onglet Actions)"
        type: boolean
        default: false

permissions:
  contents: write      # tag v<version> sur le commit construit
  id-token: write      # attestation de provenance
  attestations: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Vérifier la version
        id: v
        run: |
          set -euo pipefail
          v=$(jq -r .version src-tauri/tauri.conf.json)
          pkg=$(jq -r .version package.json)
          cargo=$(sed -nE 's/^version = "(.+)"/\1/p' Cargo.toml | head -1)
          if [ "$pkg" != "$v" ] || [ "$cargo" != "$v" ]; then
            echo "Versions différentes : tauri.conf.json $v, package.json $pkg, Cargo.toml $cargo"; exit 1
          fi
          if [ "${{ inputs.essai }}" != "true" ] && [ -n "$(git ls-remote --tags origin "refs/tags/v$v")" ]; then
            echo "Le tag v$v existe déjà : change la version avant de construire."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version $v"

  windows:
    needs: verifier
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}

      - name: Dépendances
        run: npm ci

      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-deny

      - name: Dépendances (licences, sources, interdites)
        run: cargo deny check bans licenses sources

      # Alertes de sécurité connues : affichées dans le journal, sans bloquer la construction
      # (une alerte sur une dépendance de Tauri ne se corrige pas ici). À lire avant de publier.
      - name: Dépendances (alertes de sécurité)
        continue-on-error: true
        run: cargo deny check advisories

      - name: Tests
        shell: pwsh
        run: |
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Tests en échec.' }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Vérification de l'interface en échec." }

      - name: Construire et signer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Secret TAURI_SIGNING_PRIVATE_KEY absent.' }
          # Chemins de la machine de construction réécrits dans l'exécutable.
          $sep = [char]0x1f
          $env:CARGO_ENCODED_RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=~$sep--remap-path-prefix=$PWD=.$sep-Clink-arg=/PDBALTPATH:%_PDB%"
          # Signature (.sig) de l'installateur, vérifiée avec la clé publique du dépôt.
          $extra = Join-Path $env:RUNNER_TEMP 'updater.json'
          $conf = @{
            build   = @{ beforeBuildCommand = '' }
            bundle  = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = (Get-Content src-tauri/updater-key.pub -Raw).Trim() } }
          }
          [IO.File]::WriteAllText($extra, ($conf | ConvertTo-Json -Depth 5), (New-Object Text.UTF8Encoding $false))
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Construction de l'interface en échec." }
          npm run tauri -- build --config $extra -- --locked
          if ($LASTEXITCODE -ne 0) { throw 'Construction en échec.' }

      - name: Contrôler les chemins de la machine de construction
        shell: pwsh
        run: |
          # Aucun chemin de profil Windows ni nom de compte dans l'exécutable ni l'installateur, en
          # ASCII comme en UTF-16. Restent permis : « ~\.cargo\… » (profil déjà réécrit par
          # --remap-path-prefix) et le dossier du dépôt (D:\a\…), que Tauri inscrit comme texte et
          # qui ne contient aucun nom de personne.
          $files = @('target/release/bworkshop-launcher.exe') + (Get-ChildItem target/release/bundle/nsis -Filter '*-setup.exe').FullName
          $needles = @('\Users\', '/Users/', $env:USERNAME)
          $found = $false
          foreach ($f in $files) {
            $bytes = [IO.File]::ReadAllBytes($f)
            $texts = @([Text.Encoding]::GetEncoding(28591).GetString($bytes), [Text.Encoding]::Unicode.GetString($bytes))
            foreach ($n in $needles) {
              if ($texts | Where-Object { $_.IndexOf($n, [StringComparison]::OrdinalIgnoreCase) -ge 0 }) {
                Write-Host "::error::$([IO.Path]::GetFileName($f)) contient « $n »"
                $found = $true
              }
            }
          }
          if ($found) { throw 'Chemins de construction trouvés dans les fichiers publiés.' }
          Write-Host "Aucun chemin de construction dans $($files.Count) fichier(s)."

      - name: Rassembler les fichiers Windows
        id: files
        shell: pwsh
        run: |
          $v = '${{ needs.verifier.outputs.version }}'
          $setup = Get-ChildItem target/release/bundle/nsis -Filter "*_${v}_*-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw 'Installateur introuvable.' }
          # Nom sans espace : celui que GitHub publie.
          $name = $setup.Name -replace ' ', '.'
          $out = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP 'windows')
          Copy-Item $setup.FullName (Join-Path $out $name)
          Copy-Item "$($setup.FullName).sig" (Join-Path $out "$name.sig")
          "dir=$out" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: ${{ steps.files.outputs.dir }}
          retention-days: 7

  mac:
    needs: verifier
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Rust stable (Apple Silicon et Intel)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-mac-${{ hashFiles('Cargo.lock') }}

      - name: Dépendances
        run: npm ci

      - name: Tests
        run: |
          cargo test --workspace --locked
          npm run check

      - name: Construire et signer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature « ad hoc » : pas de compte développeur Apple.
          APPLE_SIGNING_IDENTITY: "-"
        run: |
          set -euo pipefail
          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ] || { echo "Secret TAURI_SIGNING_PRIVATE_KEY absent."; exit 1; }
          # Chemins de la machine de construction réécrits dans l'exécutable.
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$HOME=~"$'\x1f'"--remap-path-prefix=$PWD=."
          extra="$RUNNER_TEMP/updater.json"
          jq -n --arg key "$(tr -d '\r\n' < src-tauri/updater-key.pub)" \
            '{build: {beforeBuildCommand: ""}, bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $key}}}' > "$extra"
          npm run build
          npm run tauri -- build --target universal-apple-darwin --config "$extra" -- --locked

      - name: Vérifier l'application
        run: |
          set -euo pipefail
          app=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          lipo -archs "$app/Contents/MacOS/bworkshop-launcher" | tee /dev/stderr | grep -q arm64
          lipo -archs "$app/Contents/MacOS/bworkshop-launcher" | grep -q x86_64
          codesign --verify --deep --strict "$app"
          # Aucun chemin du compte de construction dans l'exécutable.
          if strings -a "$app/Contents/MacOS/bworkshop-launcher" | grep -F "$HOME/" ; then
            echo "Chemins de construction trouvés dans l'exécutable."; exit 1
          fi

      - name: Démarrer l'application (20 s)
        run: |
          set -euo pipefail
          app=$(find target/universal-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' | head -1)
          "$app/Contents/MacOS/bworkshop-launcher" &
          pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "Le launcher s'est arrêté au démarrage."
            cat "$HOME/Library/Application Support/BworkshopLauncher/logs/"* 2>/dev/null || true
            exit 1
          fi
          kill "$pid"
          echo "Le launcher tourne toujours après 20 s."

      - name: Rassembler les fichiers Mac
        id: files
        run: |
          set -euo pipefail
          v='${{ needs.verifier.outputs.version }}'
          bundle=target/universal-apple-darwin/release/bundle
          out="$RUNNER_TEMP/mac"; mkdir -p "$out"
          dmg=$(find "$bundle/dmg" -maxdepth 1 -name "*_${v}_universal.dmg" | head -1)
          tgz=$(find "$bundle/macos" -maxdepth 1 -name '*.app.tar.gz' | head -1)
          [ -n "$dmg" ] && [ -n "$tgz" ] || { echo "Fichiers Mac introuvables."; exit 1; }
          cp "$dmg" "$out/Bworkshop.Launcher_${v}_universal.dmg"
          cp "$tgz" "$out/Bworkshop.Launcher_${v}_universal.app.tar.gz"
          cp "$tgz.sig" "$out/Bworkshop.Launcher_${v}_universal.app.tar.gz.sig"
          echo "dir=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac
          path: ${{ steps.files.outputs.dir }}
          retention-days: 7

  publier:
    needs: [verifier, windows, mac]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/in

      - name: Préparer les fichiers de la release
        id: files
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          v='${{ needs.verifier.outputs.version }}'
          tag="Launcher$v"
          base="https://github.com/SiclUve/bworkshop-releases/releases/download/$tag"
          out="$RUNNER_TEMP/release"; mkdir -p "$out"
          cp "$RUNNER_TEMP"/in/windows/* "$RUNNER_TEMP"/in/mac/* "$out/"
          cd "$out"
          setup=$(ls *-setup.exe | head -1)
          dmg="Bworkshop.Launcher_${v}_universal.dmg"
          tgz="Bworkshop.Launcher_${v}_universal.app.tar.gz"
          for f in "$setup" "$dmg"; do sha256sum "$f" > "$f.sha256"; done
          win_hash=$(cut -d' ' -f1 "$setup.sha256")
          mac_hash=$(cut -d' ' -f1 "$dmg.sha256")
          # Mises à jour : installateur Windows ; archive de l'application pour les deux sortes de Mac.
          jq -n --arg v "$v" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg wsig "$(tr -d '\r\n' < "$setup.sig")" --arg wurl "$base/$setup" \
            --arg msig "$(tr -d '\r\n' < "$tgz.sig")" --arg murl "$base/$tgz" \
            '{version: $v, notes: $notes, pub_date: $date, platforms: {
                "windows-x86_64": {signature: $wsig, url: $wurl},
                "darwin-aarch64": {signature: $msig, url: $murl},
                "darwin-x86_64": {signature: $msig, url: $murl}}}' > latest.json
          short=${GITHUB_SHA:0:7}
          {
            echo "## Bworkshop Launcher $v"
            echo
            echo "$NOTES"
            echo
            echo "**Windows :** [$setup]($base/$setup)  "
            echo "SHA-256 : \`$win_hash\`"
            echo
            echo "**Mac (Apple Silicon et Intel) :** [$dmg]($base/$dmg)  "
            echo "SHA-256 : \`$mac_hash\`"
            echo
            echo "Vérifier le fichier téléchargé :"
            echo
            echo '```powershell'
            echo "Get-FileHash \"\$env:USERPROFILE\\Downloads\\$setup\" -Algorithm SHA256"
            echo '```'
            echo
            echo '```sh'
            echo "shasum -a 256 ~/Downloads/$dmg"
            echo '```'
            echo
            echo "Construit par GitHub Actions depuis le commit [$short](https://github.com/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) ([journal de construction]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)). Provenance vérifiable : \`gh attestation verify <fichier> -R $GITHUB_REPOSITORY\`"
            echo
            echo "Windows 10 et 11 · installation sans droits administrateur · macOS 11 ou plus récent · code source : https://github.com/SiclUve/bworkshop-launcher"
            echo
            echo "Windows : l'installateur n'a pas de certificat de signature de code, Windows SmartScreen peut afficher « Windows a protégé votre ordinateur ». Clique sur « Informations complémentaires » puis « Exécuter quand même »."
            echo
            echo "Mac : l'application n'est pas signée par un compte développeur Apple. Glisse-la dans Applications et ouvre-la : macOS refuse la première fois. Ferme le message, puis va dans Réglages Système > Confidentialité et sécurité et clique en bas sur « Ouvrir quand même » (sur macOS 14 ou plus ancien, clic droit sur l'application > Ouvrir suffit aussi)."
          } > "$RUNNER_TEMP/release-notes.md"
          echo "dir=$out" >> "$GITHUB_OUTPUT"
          echo "setup=$setup" >> "$GITHUB_OUTPUT"
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"
          ls -l

      - name: Fichiers de l'essai
        if: ${{ inputs.essai }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: essai-launcher-${{ needs.verifier.outputs.version }}
          path: ${{ steps.files.outputs.dir }}
          retention-days: 7

      - name: Attestation de provenance
        if: ${{ !inputs.essai }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ steps.files.outputs.dir }}/${{ steps.files.outputs.setup }}
            ${{ steps.files.outputs.dir }}/${{ steps.files.outputs.dmg }}

      - name: Release en brouillon et tag
        if: ${{ !inputs.essai }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "Secret RELEASES_TOKEN absent."; exit 1; }
          v='${{ needs.verifier.outputs.version }}'
          gh release create "Launcher$v" "${{ steps.files.outputs.dir }}"/* --repo SiclUve/bworkshop-releases --draft \
            --title "Bworkshop Launcher $v" --notes-file "$RUNNER_TEMP/release-notes.md"
          # Le tag relie la version publiée au code exact qui l'a produite.
          git tag "v$v" "$GITHUB_SHA"
          git push origin "v$v"
          echo "Brouillon prêt : https://github.com/SiclUve/bworkshop-releases/releases"
