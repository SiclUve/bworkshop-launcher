[package]
name = "bworkshop-core"
description = "Cœur testable du Bworkshop Launcher, sans dépendance à l'interface"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = { version = "0.4", features = ["std"] }
semver = "1"
sha2 = "0.11"
url = "2"
# Client HTTP bloquant (utilisé hors du fil de l'interface), TLS rustls + magasin de certificats
# Windows ; http2 : GitHub et bworkshop.app répondent en HTTP/2 (moins de connexions).
# Cryptographie : ring, comme la mise à jour du launcher (tauri-plugin-updater). Pas aws-lc-rs :
# une seule bibliothèque, et pas de code C qui garderait les chemins de la machine de construction.
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
