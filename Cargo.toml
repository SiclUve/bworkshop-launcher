[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.1.5"
edition = "2024"
license = "MIT"

# Binaire de livraison : petit et rapide (budget installateur < 10 Mo).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
