[package]
name = "bworkshop-launcher"
description = "Bworkshop Launcher : gestionnaire d'outils Dofus de bworkshop.app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bworkshop-core = { path = "../crates/core" }
# tray-icon : icône près de l'horloge ; unstable : fenêtres à plusieurs vues
# (`Window::add_child`), utilisées par les widgets (page de l'outil + barre).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
# Une seule copie du launcher : un second lancement réaffiche la fenêtre existante.
tauri-plugin-single-instance = "2"
# Ouvre les liens externes dans le navigateur par défaut.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# Pas appelé directement : le code généré par `tauri::generate_context!` en a besoin.
serde_json = "1"
log = "0.4"
# Mise à jour du launcher, signée (voir updater.rs).
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Mêmes versions que celles de Tauri (pas de doublon).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry"] }
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
# Mêmes versions que celles de Tauri (Tao, Wry) : appels AppKit sur les fenêtres du launcher
# et lecture de la liste des fenêtres (suivi de Dofus).
objc2 = "0.6"
libc = "0.2"
# Raccourcis clavier globaux (API Carbon `RegisterEventHotKey`, sans autorisation spéciale).
global-hotkey = "0.7"
