[package]
name = "bworkshop-launcher"
description = "Bworkshop Launcher : gestionnaire d'outils Dofus de bworkshop.app"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bworkshop-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Mêmes versions que celles de Tauri (pas de doublon).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Accessibility", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_System_Registry"] }
webview2-com = "0.39"
